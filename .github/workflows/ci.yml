name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional dependencies
        run: pip install jsonschema openpyxl
      - name: Framework self-tests (genericity, scaffold, guard, translator fixtures)
        run: bash tests/run.sh
      - name: Shell syntax
        run: bash -n scripts/run_autonomous.sh tests/run.sh
